<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trapesium">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<title>Trapesium by OJK</title>
<style>
@property --red{syntax:"<color>";inherits:true;initial-value:#c8102e}
@property --redd{syntax:"<color>";inherits:true;initial-value:#a30c26}
@property --redt{syntax:"<color>";inherits:true;initial-value:#fdecef}
@property --redt2{syntax:"<color>";inherits:true;initial-value:#f9d9df}
@property --tint1{syntax:"<color>";inherits:true;initial-value:#fff5f7}
@property --h1{syntax:"<color>";inherits:true;initial-value:#d3163a}
@property --h2{syntax:"<color>";inherits:true;initial-value:#b20e2b}
@property --h3{syntax:"<color>";inherits:true;initial-value:#930a22}
@property --glow{syntax:"<color>";inherits:true;initial-value:rgba(200,16,46,.10)}
@property --glow2{syntax:"<color>";inherits:true;initial-value:rgba(200,16,46,.07)}
@property --hsh{syntax:"<color>";inherits:true;initial-value:rgba(163,12,38,.7)}
html{transition:--red .7s ease,--redd .7s ease,--redt .7s ease,--redt2 .7s ease,--tint1 .7s ease,--h1 .7s ease,--h2 .7s ease,--h3 .7s ease,--glow .7s ease,--glow2 .7s ease,--hsh .7s ease}
html[data-space="edu"]{--red:#24508f;--redd:#1b3f73;--redt:#e8f0fb;--redt2:#cfe0f6;--tint1:#f3f8ff;--h1:#3270c4;--h2:#24569c;--h3:#183f78;--glow:rgba(36,80,143,.11);--glow2:rgba(36,80,143,.07);--hsh:rgba(24,63,120,.7)}
:root{
 --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --bg:#f4f4f6;--card:#fff;--ink:#1c1a1d;--mute:#6e6a72;--faint:#a39fa8;--line:#ebe9ee;--field:#f5f4f7;
 --red:#c8102e;--redd:#a30c26;--redt:#fdecef;--redt2:#f9d9df;--tint1:#fff5f7;--h1:#d3163a;--h2:#b20e2b;--h3:#930a22;--glow:rgba(200,16,46,.10);--glow2:rgba(200,16,46,.07);--hsh:rgba(163,12,38,.7);
 --s1:#c8102e;--s2:#3e6db5;--s3:#b7791f;--g1:#9b0c24;--g2:#f08a9a;
 --pos:#2e7d4f;--neg:#c8102e;--net:#8a8590;
 --sh:0 1px 2px rgba(28,26,29,.04),0 10px 30px -12px rgba(28,26,29,.10);
 --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(900px 520px at 105% -5%,var(--glow),transparent 60%),radial-gradient(800px 600px at -10% 105%,var(--glow2),transparent 60%),radial-gradient(rgba(28,26,29,.05) 1px,transparent 1.3px);background-size:auto,auto,22px 22px;background-attachment:fixed;color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mu{color:var(--mute);font-size:12px;font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px 18px;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{flex:none;width:42px;height:42px;border-radius:13px;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(200,16,46,.55)}
.logo svg{width:26px;height:26px;fill:#fff}
.bn{min-width:0}
.bn b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.bn b span{color:var(--red)}
.bn small{display:block;font-size:11px;line-height:1.35;color:var(--mute);font-weight:500;margin-top:2px}
.nav{position:relative;display:flex;flex-direction:column;gap:4px;margin-top:30px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:0;background:none;border-radius:14px;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;transition:color .25s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--red)}
.nav svg{width:21px;height:21px;flex:none;transition:transform .35s var(--ease)}
.nav button.on svg{transform:scale(1.08)}
.ind{position:absolute;left:0;right:0;top:0;height:46px;border-radius:14px;background:var(--redt);transform:translateY(calc(var(--i,0) * 50px));transition:transform .45s var(--ease)}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--field);cursor:pointer;border:0;text-align:left;width:100%}
.foot:hover{background:var(--line)}
.av{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--redt);color:var(--red);position:relative}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card);background:var(--pos)}
.av .dot.off{background:#d9a12b}
.foot .t{min-width:0;flex:1}
.foot .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .t span{display:block;font-size:11px;color:var(--mute)}
.top{display:none}
.main{margin-left:248px;padding:30px 36px 56px;min-height:100vh}
.page{max-width:1120px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:0}
.ph p{margin:4px 0 0;color:var(--mute);font-weight:500}
.err{background:var(--redt);color:var(--redd);border-radius:14px;padding:10px 14px;font-weight:600;font-size:13px;margin-bottom:16px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border-radius:22px;padding:20px 22px;box-shadow:var(--sh);min-width:0}
.card+.card{margin-top:16px}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{font-size:13px;color:var(--mute);margin:2px 0 16px}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.dash .card+.card{margin-top:0}
.sp8{grid-column:span 8}.sp7{grid-column:span 7}.sp5{grid-column:span 5}.sp4{grid-column:span 4}.sp12{grid-column:1/-1}
.empty{color:var(--mute);padding:28px 8px;text-align:center}
.note{font-size:13px;color:var(--mute);margin-top:12px}.note b{color:var(--ink)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-size:14px;background:var(--red);color:#fff;cursor:pointer;transition:transform .15s var(--ease),background .2s,box-shadow .2s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--redd)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.soft{background:var(--redt);color:var(--red)}.btn.soft:hover{background:var(--redt2)}
.btn.plain{background:var(--field);color:var(--ink)}.btn.plain:hover{background:var(--line)}
.btn.onred{background:#fff;color:var(--red)}.btn.onred:hover{background:#ffe9ed}
.btn.glass{background:rgba(255,255,255,.16);color:#fff}.btn.glass:hover{background:rgba(255,255,255,.26)}
.btn svg{width:18px;height:18px}
.lnk{background:none;border:0;padding:0;font-weight:700;color:var(--red);cursor:pointer;font-size:13px}
.lnk:hover{text-decoration:underline}
.seg{display:inline-flex;background:#ebeaee;border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,26,29,.1)}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mute)}
input,select,textarea{background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;color:var(--ink);transition:border-color .2s,background .2s;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--red);background:#fff}
textarea{resize:vertical;min-height:72px}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:1/-1}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{position:relative;flex-direction:row}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;transition:all .2s}
.opts input:checked+span{border-color:var(--red);background:var(--redt);color:var(--red)}
.opts input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>b{font-size:12px;font-weight:600;color:var(--mute)}
.ok{margin-top:14px;font-size:13px;font-weight:600;background:#eaf5ee;color:#215c3a;border-radius:12px;padding:10px 14px}
.hint{font-size:12px;color:var(--mute);margin-top:12px}

/* ---------- tags & sentiment ---------- */
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.SLIK{background:#fce8ec;color:#b00e29}.tag.Pengaduan{background:#e8effa;color:#2f5a9e}.tag.Lainnya{background:#fbf1e1;color:#8a5a12}
.sent{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);white-space:nowrap}
button.sent{cursor:pointer}button.sent:hover{border-color:var(--faint)}
.sent i{width:8px;height:8px;border-radius:50%;background:var(--net)}
.sent.pos i{background:var(--pos)}.sent.neg i{background:var(--neg)}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,var(--h1) 0%,var(--h2) 55%,var(--h3) 100%);color:#fff;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;min-height:236px;box-shadow:0 18px 40px -22px var(--hsh)}
.hero>*{position:relative;z-index:1}
.hero .bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero .bg svg{position:absolute;fill:#fff;opacity:.08}
.hero .bg .a{width:220px;right:-40px;top:-60px;animation:float 11s ease-in-out infinite}
.hero .bg .b{width:120px;left:38%;bottom:-38px;animation:float 9s ease-in-out -3s infinite;opacity:.06}
.hero .bg .c{width:70px;left:-14px;top:30px;animation:float 13s ease-in-out -6s infinite;opacity:.07}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 2.2s infinite}
.big{font-size:88px;font-weight:800;line-height:1;letter-spacing:-.045em;margin:14px 0 4px}
.hero .lbl{font-size:15px;font-weight:600;color:rgba(255,255,255,.92)}
.hchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hchips span{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600}
.hchips b{font-weight:800;margin-left:4px}
.hact{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hchart{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(255,255,255,.08);border-radius:20px;padding:16px 16px 10px}
.hchart .hl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:6px}
.hchart svg{display:block;width:100%;height:auto;overflow:visible}
.hchart .ax{fill:rgba(255,255,255,.7);font-size:11px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.tile{background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;min-width:0}
.tile .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--redt);color:var(--red);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile .l{font-size:12px;font-weight:600;color:var(--mute)}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.tile .s{font-size:12px;color:var(--mute)}
.feed{margin-top:6px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .av{width:40px;height:40px;border-radius:13px}
.av.Male{background:#f6dde2;color:#9b0c24}.av.Female{background:#fdecef;color:#d6455c}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m span{display:block;font-size:12px;color:var(--mute)}
.it .r{text-align:right;flex:none}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:1.25fr repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.kpi .l{font-size:12px;font-weight:600;color:var(--mute)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.kpi .s{font-size:12px;color:var(--mute)}
.kpi.hi{background:linear-gradient(135deg,var(--h1),var(--h3));color:#fff}
.kpi.hi .l,.kpi.hi .s{color:rgba(255,255,255,.85)}
.kpi.hi .v{font-size:40px}
.kpi.hi .spk path.ln{stroke:#fff}.kpi.hi .spk circle{fill:#fff}.kpi.hi .spk path.ar{fill:#fff;opacity:.15}
.ring{flex:none}.rt{font-size:12px;font-weight:700;fill:var(--ink)}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.ax{font-size:11px;fill:var(--faint);font-weight:500}
.val{font-size:12px;font-weight:700;fill:var(--ink)}
.hit .cross{stroke:var(--faint);stroke-width:1;opacity:0;transition:opacity .15s}.hit .hv{opacity:0;transition:opacity .15s}
.hit:hover .cross{opacity:.7}.hit:hover .hv{opacity:1}
.legend{display:flex;gap:16px;font-size:12px;font-weight:600;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dn{font-size:30px;font-weight:800;fill:var(--ink);letter-spacing:-.03em}
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.dleg{flex:1;min-width:150px;font-size:13px}
.dleg .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.dleg .r:first-child{border-top:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.seg-a{transition:stroke-width .2s}.seg-a:hover{stroke-width:24}
.heat{display:grid;gap:4px;align-items:center}
.hh,.hd{font-size:11px;color:var(--faint);text-align:center;font-weight:600}.hd{text-align:left}
.hc{position:relative;height:32px;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--field)}
.hc i{position:absolute;inset:0;background:var(--s1)}
.hc b{position:relative;font-size:12px;font-weight:700;color:var(--ink)}.hc b.w{color:#fff}
.hleg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);margin-top:12px;font-weight:600}
.hleg i{width:18px;height:10px;border-radius:3px;background:var(--s1)}.hleg span:first-child{margin-right:4px}.hleg span:last-child{margin-left:4px}
.hb{margin-bottom:14px}.hb:last-child{margin-bottom:0}
.hbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px;gap:10px}
.hbt{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--field)}.hbt div{height:100%}.hbt div+div{margin-left:2px}
.tbw{height:10px;border-radius:5px;background:var(--field);overflow:hidden}
.tb{height:100%;border-radius:5px;background:var(--red)}
.nq{font-size:13px;background:var(--field);border-radius:12px;padding:10px 12px;margin-top:8px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.6;padding:8px 11px;border-radius:10px;max-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}
#tip .sw{width:8px;height:8px;margin-right:6px}

/* ---------- data ---------- */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bar label{min-width:130px}
.tablewrap{overflow:auto;max-height:560px;margin:0 -22px -20px;padding:0 22px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mute);font-weight:600;z-index:1}
tbody tr{transition:background .15s}tbody tr:hover{background:#faf9fb}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td.nt{min-width:180px;max-width:320px}
.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--red);background:var(--redt)}
.acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acct .av{width:48px;height:48px;border-radius:16px;font-size:18px}
.acct .t{flex:1;min-width:180px}
.acct .t b{display:block;font-size:15px}
.acct .t span{font-size:13px;color:var(--mute)}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--redt);color:var(--redd);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:16px}

/* ---------- import ---------- */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:18px;padding:26px 16px;text-align:center;color:var(--mute);font-weight:600;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--red);background:var(--redt);color:var(--red)}
.drop svg{width:30px;height:30px}
.drop input{display:none}
.steps{margin:12px 0 0;padding-left:20px;color:var(--mute);font-size:13px}
.steps li{margin:3px 0}
.irow{display:flex;gap:10px;flex-wrap:wrap}
.irow input{flex:1;min-width:220px}
.isum{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.isum span{background:var(--field);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600}
.isum span.g{background:#eaf5ee;color:#215c3a}
.map{font-size:12px;color:var(--mute);margin-bottom:10px}
.map.pii{display:flex;gap:8px;align-items:flex-start;background:#eef7ef;color:#2c5a33;border-radius:10px;padding:9px 12px}.map.pii svg{width:16px;height:16px;flex:none;margin-top:1px}
.map b{color:var(--ink);font-weight:600}

/* ---------- edukasi ---------- */
.eban{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,#fff3f5 0%,#fde1e7 100%);padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:center;min-height:200px}
.eban h2{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.2}
.eban p{margin:8px 0 0;color:#6b3a44;font-weight:500;max-width:440px}
.eban .art{position:relative;height:180px}
.eban .art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit{transform-origin:120px 92px;animation:spin 16s linear infinite}
.bob{animation:bob 4.5s ease-in-out infinite}
.tw{animation:twinkle 2.8s ease-in-out infinite}
.tw.d2{animation-delay:-1s}.tw.d3{animation-delay:-1.9s}
.eban .fz{position:absolute;fill:var(--red);opacity:.07;pointer-events:none}
.tl .ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.tl .ev:first-child{border-top:0}
.db{background:var(--redt);color:var(--red);border-radius:14px;text-align:center;padding:7px 0 6px;line-height:1.1}
.db b{display:block;font-size:20px;font-weight:800}
.db span{font-size:11px;font-weight:700;text-transform:uppercase}
.ev h3{margin:0;font-size:14px;font-weight:700}
.ev p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.ev .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ev .meta span{background:var(--field);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.login .bg svg{position:absolute;fill:var(--red);opacity:.06}
.lcard{position:relative;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:34px 30px;max-width:400px;width:100%;text-align:center}
.lcard .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 18px}
.lcard .logo svg{width:40px;height:40px}
.lcard h1{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:0}
.lcard h1 span{color:var(--red)}
.lcard p{color:var(--mute);margin:6px 0 24px;font-weight:500}
.lcard .btn{width:100%;padding:13px 18px}
.gicon{width:20px;height:20px;background:#fff;border-radius:50%;display:grid;place-items:center}

/* ---------- motion ---------- */
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(5deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes ping{0%{r:4;opacity:.7}100%{r:14;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes sweep{from{stroke-dasharray:0 var(--c)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.ping{animation:ping 1.8s ease-out infinite}
.enter .rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--d,0) * 70ms)}
.enter .draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.45,0,.2,1) .2s forwards}
.enter .area{animation:fade .9s ease .5s both}
.enter .sweep{animation:sweep 1s cubic-bezier(.45,0,.2,1) .15s both}
.enter .grow{transform-origin:left;animation:grow .9s var(--ease) .2s both}
.enter .hc i{animation:fade .6s ease both}
.enter .dots{animation:fade .5s ease 1s both}

/* ---------- responsive ---------- */

 .dash>.card{grid-column:1/-1}
